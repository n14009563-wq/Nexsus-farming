# NexusFarming configuration
#
# Everything here revolves around one item: a plain vanilla GOLDEN HOE, no NBT tag or special
# recipe required -- any golden hoe works, so it's still enchantable, renameable, and tradeable
# like normal. Hold it, right-click a crop, and this plugin takes over. Nothing here uses a
# resource pack: every visual cue is a vanilla display name, vanilla lore, a vanilla particle, or
# a vanilla sound.

harvest:
  enabled: true

  bonusYield:
    # Base chance (0.0-1.0) that a harvest produces extra crops on top of the normal drop.
    baseChance: 0.20

    # Extra crops rolled on a successful bonus (inclusive range).
    minExtra: 1
    maxExtra: 3

    # Added to baseChance per level of Fortune on the golden hoe.
    fortuneBonusPerLevel: 0.10

    # Hard ceiling on the final bonus chance, however much Fortune/Fertility push it up.
    chanceCap: 0.90

  aoe:
    # Sneak + right-click harvest reaps every mature crop in a radius around the clicked block,
    # instead of just the one block.
    enabled: true

    # Radius actually used, in blocks.
    radius: 3

    # Hard server-side ceiling on "radius" above -- protects against a misconfigured huge radius
    # turning one right-click into a lag spike.
    maxRadius: 6

    # Absolute cap on how many blocks a single AoE reap will process, regardless of how many
    # mature crops are inside the radius. The extra ones are simply left for the next click.
    maxBlocksPerUse: 64

  durability:
    # Right-clicking a crop costs the golden hoe durability, same as normal tool use.
    enabled: true

    # Durability points spent per block harvested (before Unbreaking's chance-to-not-break-it
    # is applied, exactly like vanilla tool damage).
    perBlock: 1

# Right-clicking a crop that ISN'T mature yet nudges its growth forward instead of harvesting it
# -- a small, durability-costed "hurry up" rather than an instant free-grow.
growthNudge:
  enabled: true

  # Growth stages advanced per nudge (capped at the crop's own max age).
  stages: 1

  # Per-player cooldown between nudges, so a field can't be insta-matured by spam-clicking.
  cooldownSeconds: 8

  # Durability cost per nudge.
  durabilityCost: 1

# Farmland you keep working builds up a "Fertility" level over time, each level adding to the
# bonus-yield chance on that specific tile. Left untouched, it slowly decays back down.
fertility:
  enabled: true

  # Highest Fertility level a single farmland tile can reach.
  maxLevel: 5

  # Bonus-yield chance added per Fertility level on that tile.
  bonusChancePerLevel: 0.05

  # Real days of in-game inactivity before a tile starts losing Fertility levels.
  decayAfterDays: 3

  # How often (real seconds) Fertility data is saved to disk in the background.
  saveIntervalSeconds: 300

# Every harvest has a small chance to produce a shimmering Golden Crop instead of a plain one --
# no resource pack, just a gold-colored name, an enchant glint (with the enchant text hidden),
# and descriptive lore. Eating one gives a real, temporary buff.
goldenCrops:
  enabled: true

  # Chance (0.0-1.0) per harvested crop of it coming out golden.
  chance: 0.03

  # How long the buff from eating one lasts, in real seconds.
  buffDurationSeconds: 30

  # Potion effect amplifier applied by the buff (0 = level I).
  buffAmplifier: 1

# Place a Carved Pumpkin on top of a Hay Bale in a field and it becomes a Scarecrow: any crop
# within its radius is protected from being trampled back into dirt, by players, villagers, or
# mobs alike. Break either block to remove it.
scarecrow:
  enabled: true

  # Protection radius in blocks around the Scarecrow's pumpkin.
  radius: 5

# Vanilla-only sound and particle feedback for harvests, bonus yield, golden crops, and Scarecrow
# placement. Turn off if you'd rather it stay silent.
effects:
  enabled: true
